name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm python3 python3-websockets curl qemu-system-x86 dosbox-x mtools libgmp10 libmpc3 libmpfr6

      - name: Cache the ia16-elf toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ hashFiles('tools/get-toolchain.sh') }}

      - name: Fetch the ia16-elf toolchain
        run: make toolchain

      - name: Lab solutions still apply
        run: |
          for patch in docs/labs/solutions/*.patch; do
            git apply --check "$patch"
          done

      - name: Build without telemetry
        run: |
          make TELEMETRY=0 all check
          python3 tools/smoke_test.py build/phoenix8086.img
          make clean

      - name: Build
        run: make all

      - name: Test
        run: make test

      - name: Test on an emulated 8086
        run: make test-8086

      - name: Short soak test
        run: make soak SOAK_SECONDS=90

      - name: Build the demo site
        run: ./tools/build_site.sh

      - name: Install the emulator and browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund v86@0.5.469 playwright-core axe-core
          npx playwright-core install --with-deps chromium-headless-shell

      - name: Test the demo engine in v86
        run: node tools/test_browser_demo.mjs site

      - name: Test the dashboard in a real browser
        run: node tools/test_dashboard_browser.mjs build/screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: build/screenshots
          if-no-files-found: ignore
