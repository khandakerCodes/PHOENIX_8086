name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm python3 python3-websockets curl qemu-system-x86 dosbox-x mtools libgmp10 libmpc3 libmpfr6

      - name: Cache the ia16-elf toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ hashFiles('tools/get-toolchain.sh') }}

      - name: Fetch the ia16-elf toolchain
        run: make toolchain

      - name: Build without telemetry
        run: |
          make TELEMETRY=0 all check
          python3 tools/smoke_test.py build/phoenix8086.img
          make clean

      - name: Build
        run: make all

      - name: Test
        run: make test

      - name: Test on an emulated 8086
        run: make test-8086

      - name: Short soak test
        run: make soak SOAK_SECONDS=90
